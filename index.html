<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlueCart Products</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="container">
        <h1 class="logo">BlueCart</h1>
        <p>Simple Product Store</p>
    </div>
</header>

<main>
    <section class="products-section">
        <div class="container">

            <div class="section-title">
                <p>OUR PRODUCTS</p>
                <h2>All Products</h2>
            </div>

            <div id="productContainer" class="product-grid"></div>

            <p id="loadingMessage" class="message">
                Loading products...
            </p>

            <p id="errorMessage" class="message error hidden">
                Could not load products.
            </p>

        </div>
    </section>
</main>

<!-- Product Details Modal -->
<div id="productModal" class="modal hidden">

    <div class="modal-content">

        <button id="closeModal" class="close-button">&times;</button>

        <div id="productDetails"></div>

    </div>

</div>

<footer class="footer">
    <div class="container">
        <p>&copy; 2026 BlueCart. All rights reserved.</p>
    </div>
</footer>

<script src="script.js"></script>

</body>
</html>
